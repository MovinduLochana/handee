name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test-and-validate:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/backend/handee.Tests/handee.Tests.csproj

      - name: Build backend (Release)
        run: dotnet build --no-restore --configuration Release src/backend/handee.Tests/handee.Tests.csproj

      - name: Run backend tests
        run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=backend-test-results.trx" src/backend/handee.Tests/handee.Tests.csproj

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: src/backend/handee.Tests/TestResults/*.trx
          retention-days: 7
