name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/backend/Handee.Api.Tests/Handee.Api.Tests.csproj

      - name: Build
        run: dotnet build src/backend/Handee.Api.Tests/Handee.Api.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test src/backend/Handee.Api.Tests/Handee.Api.Tests.csproj --no-build --configuration Release
