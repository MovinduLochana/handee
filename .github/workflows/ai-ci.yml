name: AI Agent CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'agents/**'
      - '.github/workflows/ai-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'agents/**'
      - '.github/workflows/ai-ci.yml'
  workflow_dispatch:

concurrency:
  group: ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-test-and-validate:
    name: Agentic AI (Python / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agents/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run code linting (Ruff)
        run: ruff check src tests
        continue-on-error: true

      - name: Run pytest test suite & coverage
        run: pytest tests -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload AI test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-test-coverage
          path: agents/coverage.xml
          retention-days: 7
