name: Frontend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'web/**'
      - 'src/backend/**' # Included because frontend contract tests validate against C# DTOs
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'web/**'
      - 'src/backend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-test-and-validate:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run linter and formatting checks
        run: npm run check

      - name: Run unit & contract tests
        run: npm test -- --run

      - name: Type check and production build
        run: npm run build
