name: SE3090 Comprehensive Quality & Test Evaluation Suite

on:
  push:
    branches: [ main, develop, "**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ─── 1. Backend & Database Testing (.NET 10) ───────────────────────────────
  backend-testing:
    name: Backend API & Database Tests (xUnit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore Dependencies
        run: dotnet restore src/backend/handee.Tests/handee.Tests.csproj

      - name: Build Backend & Test Projects
        run: dotnet build src/backend/handee.Tests/handee.Tests.csproj --no-restore -c Release

      - name: Execute xUnit Tests with Code Coverage
        run: dotnet test src/backend/handee.Tests/handee.Tests.csproj --no-build -c Release --collect:"XPlat Code Coverage" --logger "trx;LogFileName=backend-test-results.trx"

      - name: Upload Backend Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: src/backend/handee.Tests/TestResults

  # ─── 2. Python AI Agent Testing & Evaluation (pytest) ──────────────────────
  ai-agent-testing:
    name: Agentic AI Evaluation & Adversarial Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: agents
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Execute pytest AI Evaluation Suite
        working-directory: agents
        run: |
          pytest tests -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload AI Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-test-coverage
          path: agents/coverage.xml

  # ─── 3. React Web Application Testing (Vitest + RTL) ───────────────────────
  web-portal-testing:
    name: React Web Application Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: web
        run: npm ci

      - name: Execute Vitest Suites
        working-directory: web
        run: npm test -- --run

  # ─── 4. Flutter Mobile Testing (flutter_test) ──────────────────────────────
  mobile-app-testing:
    name: Flutter Mobile Application Tests (flutter_test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter Code Hygiene
        working-directory: app
        run: flutter analyze

      - name: Execute Flutter Unit & Widget Tests
        working-directory: app
        run: flutter test --coverage
